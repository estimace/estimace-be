name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      # Credentials match DB_CONNECTION_STRING in .env.test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estimace_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: estimace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn run test
